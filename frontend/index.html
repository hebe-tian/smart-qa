<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART-QA - 登录</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">AI</div>
            <h1 class="login-title">SMART-QA</h1>
            <p class="login-subtitle">智能需求分析问答</p>

            <form id="loginForm" onsubmit="return false;">
                <div class="form-group">
                    <label class="form-label" for="username">用户名</label>
                    <input type="text" id="username" class="form-input" placeholder="请输入用户名" autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">密码</label>
                    <input type="password" id="password" class="form-input" placeholder="请输入密码" autocomplete="current-password">
                </div>
                <div id="loginError" class="form-hint" style="color: var(--danger); display: none;"></div>
                <button type="submit" class="btn btn-primary btn-lg w-full" id="loginBtn" onclick="Login.handleLogin()">
                    登录
                </button>
                <button type="button" class="btn btn-secondary btn-lg w-full" id="guestBtn" onclick="Login.handleGuest()">
                    游客访问
                </button>
            </form>

            <p class="login-footer">管理员账号由部署配置定义，如有疑问请联系管理员 | v1.0.0</p>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/analytics.js"></script>
    <script src="/js/components/toast.js"></script>
    <script src="/js/pages/login.js"></script>
</body>
</html>
