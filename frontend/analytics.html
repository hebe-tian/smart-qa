<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据概览 - SMART-QA</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <div class="main-content">
            <nav class="navbar">
                <div class="navbar-breadcrumb">
                    <span>数据概览</span>
                </div>
                <div class="navbar-right" id="navbarRight"></div>
            </nav>

            <div class="page-content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">数据概览</h1>
                        <p class="page-subtitle">平台使用统计与AI调用分析</p>
                    </div>
                    <button class="btn btn-secondary" onclick="AnalyticsPage.refresh()">刷新</button>
                </div>

                <!-- Stats Cards -->
                <div class="stats-grid" id="statsGrid"></div>

                <!-- Charts + Event Feed -->
                <div class="analytics-grid">
                    <div>
                        <div class="chart-container">
                            <h3 class="chart-title">Token消耗趋势（近7天）</h3>
                            <div class="bar-chart" id="tokenTrend"></div>
                        </div>
                        <div class="chart-container mt-6">
                            <h3 class="chart-title">AI调用统计</h3>
                            <div class="bar-chart" id="callStats"></div>
                        </div>
                    </div>
                    <div class="chart-container">
                        <h3 class="chart-title">最近事件流</h3>
                        <div class="event-feed" id="eventFeed"></div>
                    </div>
                </div>

                <div class="toast-container" id="toastContainer"></div>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/analytics.js"></script>
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/sidebar.js"></script>
    <script src="/js/components/navbar.js"></script>
    <script src="/js/router.js"></script>
    <script src="/js/pages/analytics-page.js"></script>
    <script>
        Auth.requireAuth();
        Sidebar.render('analytics');
        Navbar.render();
        Analytics.track('page_view', { page: 'analytics' });
        AnalyticsPage.load();
    </script>
</body>
</html>
